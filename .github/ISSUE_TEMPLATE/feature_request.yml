name: 💡 功能建议
description: 新 op、新特征族、新导出格式、工作流改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题（不是功能清单，是场景）
      placeholder: 作为…（身份），我在…（任务）时，因为…（缺口）不得不…（绕行成本）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 现在的替代方案与代价
    validations:
      required: false
  - type: checkboxes
    id: agree
    attributes:
      label: 讨论确认
      options:
        - label: 我知道涉及内核 op / 门控语义的改动需要先在 Discussions 对齐设计（见 CONTRIBUTING）
          required: true
