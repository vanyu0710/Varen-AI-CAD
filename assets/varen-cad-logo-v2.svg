    <text x="4" y="132" fill="#42D8E9" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="13">CAD</text>
    <path d="M4 155h342" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity=".8"/>
