<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Varen CAD logo v2</title>
  <desc id="desc">A minimal cyan crescent and wave mark forming a geometric V, with the Varen CAD wordmark.</desc>
  <defs>
