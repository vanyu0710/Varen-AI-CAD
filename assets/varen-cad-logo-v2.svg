      <stop stop-color="#8AF3FF"/><stop offset=".58" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="type" x1="270" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8F8FC"/><stop offset="1" stop-color="#8BE8F2"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 24)">
